services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: cloudboard-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://cloudboard:cloudboard_dev_password@postgres:5432/cloudboard_dev?schema=public
      ALLOWED_ORIGINS: http://localhost:3001
      JWT_ACCESS_SECRET: dev_only_secret_replace_this_in_production_min_32_chars_needed
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY_DAYS: 30
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cloudboard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cloudboard
      POSTGRES_PASSWORD: cloudboard_dev_password
      POSTGRES_DB: cloudboard_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudboard -d cloudboard_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
