services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cloudboard-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cloudboard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cloudboard
      POSTGRES_PASSWORD: cloudboard_dev_password
      POSTGRES_DB: cloudboard_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudboard -d cloudboard_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
